scalar PageCursor
scalar Any
scalar Timestamp
scalar JSON

union CredentialData = BasicCredentialData | OAuthCredentialData | CertificateOAuthCredentialData | BearerTokenCredentialData

interface Pageable {
    pageInfo: PageInfo!
    totalCount: Int!
}

enum AggregationType {
    SUM
    AVERAGE
    MIN
    MAX
    COUNT
    LAST_HOUR
    LAST_DAY
    LAST_WEEK
}

enum OperationType {
    TURN_ON
    TURN_OFF
    SEND_EMAIL
    SEND_EMAIL_WITH_CONTENT
}

enum DeviceStatus {
    INITIAL
    ACTIVE
    UNREACHABLE
    ERROR
}

enum WidgetStatus {
    INACTIVE
    ACTIVE
}

enum AlertSeverity {
    INFO
    WARNING
    CRITICAL
}

enum AlertConditionOperator {
    GT
    LT
    EQ
    GTE
    LTE
    NE
}

enum AlertEventStatus {
    TRIGGERED
    RESOLVED
    ACKNOWLEDGED
}

enum DashboardWidgetType {
    GAUGE
    LINE_CHART
    STATUS_INDICATOR
    STAT_CARD
    TABLE
}

type BearerTokenCredentialData {
    token: String!
}

type BasicCredentialData {
    username: String!
    password: String!
}

type OAuthCredentialData {
    clientId: ID!
    clientSecret: String!
    url: String!
}

type CertificateOAuthCredentialData {
    clientId: ID!
    certificate: String!
    url: String!
}

type PageInfo {
    startCursor: PageCursor!
    endCursor: PageCursor!
    hasNextPage: Boolean!
}

type Auth {
    credentialForDevice: CredentialData
    credentialForService: String
    accessStrategy: String
}

type Device {
    id: ID!
    name: String!
    description: String
    status: DeviceStatus!
    tenantId: ID!
    host: Host
    auth: Auth
    dataModel: DataModel
    tags: [String!]
    createdAt: Timestamp
    updatedAt: Timestamp
}

type Host {
    id: ID!
    url: String!
    turnOnEndpoint: String
    turnOffEndpoint: String
}

type DevicePage implements Pageable {
    data: [Device!]!
    pageInfo: PageInfo!
    totalCount: Int!
}

type WidgetPage implements Pageable {
    data: [Widget!]!
    pageInfo: PageInfo!
    totalCount: Int!
}

type Widget {
    id: ID!
    name: String!
    description: String
    status: WidgetStatus!
    tenantId: ID!
    code: String!
    workspace: String!
    deviceIds: [String!]
    schedule: String
    lastExecutedAt: Timestamp
    createdAt: Timestamp
    updatedAt: Timestamp
}

type DataModel {
    id: ID!
    name: String!
    description: String!
    schema: JSON!
    deviceCount: Int!
    currentVersion: Int!
    createdAt: Timestamp
    updatedAt: Timestamp
}

type DataModelVersion {
    id: ID!
    dataModelId: ID!
    versionNumber: Int!
    schema: JSON!
    changeDescription: String
    createdAt: Timestamp!
    createdBy: ID
}

type DeviceMetric {
    id: ID!
    deviceId: ID!
    metricName: String!
    metricValue: Float!
    unit: String
    recordedAt: Timestamp!
}

type AggregatedMetric {
    metricName: String!
    value: Float!
    count: Int!
    min: Float!
    max: Float!
    startTime: Timestamp!
    endTime: Timestamp!
}

type MetricSeries {
    metricName: String!
    unit: String
    dataPoints: [DeviceMetric!]!
}

type AlertRule {
    id: ID!
    device: Device!
    name: String!
    description: String
    severity: AlertSeverity!
    enabled: Boolean!
    cooldownMinutes: Int!
    conditions: [AlertConditionGroup!]!
    notifications: [AlertNotification!]!
    lastTriggeredAt: Timestamp
    createdAt: Timestamp
    updatedAt: Timestamp
}

type AlertConditionGroup {
    groupId: Int!
    conditions: [AlertCondition!]!
}

type AlertCondition {
    id: ID!
    metricName: String!
    operator: AlertConditionOperator!
    threshold: Float!
}

type AlertNotification {
    id: ID!
    type: String!
    config: String!
}

type AlertEvent {
    id: ID!
    triggeredValues: String!
    status: AlertEventStatus!
    triggeredAt: Timestamp!
    resolvedAt: Timestamp
}

type AlertRulePage implements Pageable {
    data: [AlertRule!]!
    pageInfo: PageInfo!
    totalCount: Int!
}

type AlertEventPage implements Pageable {
    data: [AlertEvent!]!
    pageInfo: PageInfo!
    totalCount: Int!
}

type DashboardLayout {
    id: ID!
    tenantId: ID!
    name: String!
    description: String
    isDefault: Boolean!
    refreshIntervalSeconds: Int!
    widgets: [DashboardWidget!]!
    createdAt: Timestamp
    updatedAt: Timestamp
}

type DashboardWidget {
    id: ID!
    dashboardLayoutId: ID!
    widgetType: DashboardWidgetType!
    title: String!
    gridX: Int!
    gridY: Int!
    gridCols: Int!
    gridRows: Int!
    device: Device
    metricName: String
    config: JSON!
    createdAt: Timestamp
    updatedAt: Timestamp
}

input DeviceMetricInput {
    deviceId: ID!
    metricName: String!
    metricValue: Float!
    unit: String
    recordedAt: Timestamp
}

input MetricFilterInput {
    metricName: String
    startTime: Timestamp
    endTime: Timestamp
    limit: Int
}

input HostInput {
    url: String!
    turnOnEndpoint: String
    turnOffEndpoint: String
}

input DeviceInput {
    name: String!
    description: String
    status: DeviceStatus!
    host: HostInput
    auth: AuthInput
    dataModel: String!
    tags: [String!]
}

input UpdateDeviceInput {
    name: String
    description: String
    status: DeviceStatus
    host: HostInput
    auth: AuthInput
    dataModel: String
    tags: [String!]
}

input WidgetInput {
    name: String!
    description: String
    status: WidgetStatus!
    code: String!
    workspace: String!
    deviceIds: [String!]
    schedule: String
}


input BasicCredentialDataInput {
    username: String!
    password: String!
}

input TokenCredentialDataInput {
    token: String!
}

input CertificateOAuthCredentialDataInput {
    clientId: ID!
    certificate: String!
    url: String!
}


input OAuthCredentialDataInput {
    clientId: ID!
    clientSecret: String!
    url: String!
}

input CredentialDataInput {
    basic: BasicCredentialDataInput
    oauth: OAuthCredentialDataInput
    certificateOAuth: CertificateOAuthCredentialDataInput
    bearerToken: TokenCredentialDataInput
}

input AuthInput {
    credentialForDevice: CredentialDataInput
    credentialForService: String
    accessStrategy: String
}

input DataModelInput {
    name: String!
    description: String!
    schema: JSON!
}

input UpdateDataModelInput {
    name: String
    description: String
    schema: JSON
    changeDescription: String
}

input AlertConditionInput {
    groupId: Int!
    metricName: String!
    operator: AlertConditionOperator!
    threshold: Float!
}

input AlertNotificationInput {
    type: String!
    config: String!
}

input CreateAlertRuleInput {
    deviceId: ID!
    name: String!
    description: String
    severity: AlertSeverity
    cooldownMinutes: Int
    conditions: [AlertConditionInput!]!
    notifications: [AlertNotificationInput!]!
}

input UpdateAlertRuleInput {
    name: String
    description: String
    severity: AlertSeverity
    enabled: Boolean
    cooldownMinutes: Int
    conditions: [AlertConditionInput!]
    notifications: [AlertNotificationInput!]
}

input DashboardLayoutInput {
    name: String!
    description: String
    isDefault: Boolean
    refreshIntervalSeconds: Int
}

input UpdateDashboardLayoutInput {
    name: String
    description: String
    isDefault: Boolean
    refreshIntervalSeconds: Int
}

input DashboardWidgetInput {
    widgetType: DashboardWidgetType!
    title: String!
    gridX: Int!
    gridY: Int!
    gridCols: Int!
    gridRows: Int!
    deviceId: ID
    metricName: String
    config: JSON!
}

input UpdateDashboardWidgetInput {
    title: String
    gridX: Int
    gridY: Int
    gridCols: Int
    gridRows: Int
    deviceId: ID
    metricName: String
    config: JSON
}

input WidgetPositionInput {
    widgetId: ID!
    gridX: Int!
    gridY: Int!
    gridCols: Int!
    gridRows: Int!
}

type Query {
    devices: [Device]!
    devicesPage(first: Int = 20, after: PageCursor): DevicePage!
    device(id: ID!): Device
    deviceByIdAndAggregation(id: ID!, aggregation: AggregationType!): Device
    widgets: [Widget]!
    widgetsPage(first: Int = 20, after: PageCursor): WidgetPage!
    widget(id: ID!): Widget
    dataModels: [DataModel]!
    dataModelVersions(dataModelId: ID!): [DataModelVersion!]!
    dataModelVersion(dataModelId: ID!, version: Int!): DataModelVersion
    testDeviceConnection(url: String!): Boolean!
    deviceMetrics(deviceId: ID!, filter: MetricFilterInput): [DeviceMetric!]!
    deviceMetricsSeries(deviceId: ID!, metricNames: [String!], filter: MetricFilterInput): [MetricSeries!]!
    deviceAggregatedMetrics(deviceId: ID!, aggregation: AggregationType!, filter: MetricFilterInput): AggregatedMetric
    alertRules(deviceId: ID, first: Int, after: PageCursor): AlertRulePage!
    alertRule(id: ID!): AlertRule
    alertEvents(deviceId: ID, ruleId: ID, first: Int, after: PageCursor): AlertEventPage!
    dashboardLayouts: [DashboardLayout!]!
    dashboardLayout(id: ID!): DashboardLayout
    defaultDashboardLayout: DashboardLayout
}

type Mutation {
    createDevice(input: DeviceInput!): Device!
    updateDevice(id: ID!, input: UpdateDeviceInput!): Device!
    setDeviceOperation(id: ID!, op: OperationType!): Device!
    setOperation(op: OperationType!, data: Any): Boolean!
    deleteDevice(id: String!): String!
    createWidget(input: WidgetInput!): Widget!
    deleteWidget(id: ID!): String!
    createDataModel(input: DataModelInput!): DataModel!
    deleteDataModel(id: ID!): String!
    updateDataModel(id: ID!, input: UpdateDataModelInput!): DataModel!
    rollbackDataModel(dataModelId: ID!, toVersion: Int!): DataModel!
    generateDeviceToken(deviceId: ID!): String!
    recordDeviceMetric(input: DeviceMetricInput!): DeviceMetric!
    recordDeviceMetrics(inputs: [DeviceMetricInput!]!): Boolean!
    createAlertRule(input: CreateAlertRuleInput!): AlertRule!
    updateAlertRule(id: ID!, input: UpdateAlertRuleInput!): AlertRule!
    deleteAlertRule(id: ID!): ID!
    acknowledgeAlertEvent(id: ID!): AlertEvent!
    createDashboardLayout(input: DashboardLayoutInput!): DashboardLayout!
    updateDashboardLayout(id: ID!, input: UpdateDashboardLayoutInput!): DashboardLayout!
    deleteDashboardLayout(id: ID!): ID!
    addDashboardWidget(layoutId: ID!, input: DashboardWidgetInput!): DashboardWidget!
    updateDashboardWidget(id: ID!, input: UpdateDashboardWidgetInput!): DashboardWidget!
    deleteDashboardWidget(id: ID!): ID!
    updateWidgetPositions(layoutId: ID!, positions: [WidgetPositionInput!]!): Boolean!
}

type Subscription {
    metricRecorded(deviceId: ID!): DeviceMetric!
}