fragment WidgetInfo on Widget {
    id
    name
    description
    status
    tenantId
    code
    workspace
    deviceIds
    schedule
    lastExecutedAt
    createdAt
    updatedAt
}

query GetAllWidgets {
    widgets {
        ...WidgetInfo
    }
}

query GetWidget($id: ID!) {
    widget(id: $id) {
        ...WidgetInfo
    }
}

query GetWidgetsPage($first: Int, $after: PageCursor) {
    widgetsPage(first: $first, after: $after) {
        data {
            ...WidgetInfo
        }
        pageInfo {
            startCursor
            endCursor
            hasNextPage
        }
        totalCount
    }
}

mutation CreateWidget($input: WidgetInput!) {
    createWidget(input: $input) {
        ...WidgetInfo
    }
}

mutation UpdateWidget($id: ID!, $input: WidgetInput!) {
    updateWidget(id: $id, input: $input) {
        ...WidgetInfo
    }
}

mutation CloneWidget($id: ID!) {
    cloneWidget(id: $id) {
        ...WidgetInfo
    }
}

mutation DeleteWidget($id: ID!) {
    deleteWidget(id: $id)
}
