<div class="template-picker">
    <h1 mat-dialog-title>Create dashboard from template</h1>
    <div mat-dialog-content>
        <div class="template-picker__grid">
            @for (template of templates; track template.id) {
                <button
                    type="button"
                    class="template-picker__card"
                    [class.template-picker__card--selected]="isSelected(template)"
                    (click)="select(template)"
                    [attr.aria-pressed]="isSelected(template)"
                >
                    <mat-icon class="template-picker__icon">{{ template.icon }}</mat-icon>
                    <span class="template-picker__name">{{ template.name }}</span>
                    <span class="template-picker__description">{{ template.description }}</span>
                    @if (isSelected(template)) {
                        <mat-icon class="template-picker__check">check_circle</mat-icon>
                    }
                </button>
            }
        </div>
    </div>
    <div mat-dialog-actions align="end">
        <button mat-button (click)="cancel()">Cancel</button>
        <button mat-raised-button color="primary" (click)="confirm()">
            Create
        </button>
    </div>
</div>
