<div class="confirm-dialog">
    <h1 mat-dialog-title>{{ data.title }}</h1>
    <div mat-dialog-content>
        <p class="confirm-dialog__message">{{ data.message }}</p>

        @if (data.requireTextConfirmation) {
            <p class="confirm-dialog__hint">
                Type <strong>{{ data.requireTextConfirmation }}</strong> to
                confirm.
            </p>
            <mat-form-field appearance="outline" class="confirm-dialog__field">
                <input
                    matInput
                    [(ngModel)]="typedConfirmation"
                    (keyup.enter)="confirm()"
                    [placeholder]="data.requireTextConfirmation"
                    aria-label="Confirmation text"
                    autocomplete="off"
                />
            </mat-form-field>
        }
    </div>
    <div mat-dialog-actions align="end">
        <button mat-button (click)="cancel()">{{ data.cancelText }}</button>
        <button
            mat-raised-button
            [color]="data.confirmColor"
            [disabled]="!canConfirm"
            (click)="confirm()"
        >
            {{ data.confirmText }}
        </button>
    </div>
</div>
