<div class="app__wrapper">
    <div class="app__left-panel">
        <!--    <img-->
        <!--      class="avatar mat-elevation-z8"-->
        <!--      src="https://source.unsplash.com/c_GmwfHBDzk/200x200"-->
        <!--    />-->

        <h4 class="name">John Smith</h4>
        <p class="designation">Software Engineer</p>
        @if (!isLoggedIn) {
            <button
                mat-button
                class="menu-button"
                (click)="onLoginClick()"
            >
                <mat-icon>login</mat-icon>
                <span>Login</span>
            </button>
        }

        @if (isLoggedIn) {
            <div>
                <button
                    mat-button
                    class="menu-button"
                    (click)="onLogoutClick()"
                >
                    <mat-icon>logout</mat-icon>
                    <span>Logout</span>
                </button>

                <mat-divider></mat-divider>

                <button mat-button class="menu-button" routerLink="/profile">
                    <mat-icon>person</mat-icon>
                    <span>Profile</span>
                </button>
                <button mat-button class="menu-button" routerLink="/notifications">
                    <mat-icon>notifications</mat-icon>
                    <span>Notifications</span>
                </button>

                <mat-divider></mat-divider>

                <button mat-button class="menu-button" routerLink="/home">
                    <mat-icon>home</mat-icon>
                    <span>Home</span>
                </button>

                <mat-expansion-panel class="dashboard-submenu" [expanded]="isDashboardsExpanded" (opened)="isDashboardsExpanded = true" (closed)="isDashboardsExpanded = false">
                    <mat-expansion-panel-header>
                        <mat-panel-title>
                            <mat-icon>dashboard</mat-icon>
                            <span>Dashboards</span>
                        </mat-panel-title>
                    </mat-expansion-panel-header>

                    @for (layout of dashboardLayouts; track layout.id) {
                        <button mat-button class="menu-button submenu-button" (click)="navigateToDashboard(layout.id)">
                            <mat-icon>{{ layout.isDefault ? 'star' : 'dashboard_customize' }}</mat-icon>
                            <span>{{ layout.name }}</span>
                        </button>
                    }

                    @if (dashboardLayouts.length === 0) {
                        <div class="submenu-empty">No dashboards yet</div>
                    }

                    <mat-divider></mat-divider>

                    <button mat-button class="menu-button submenu-button" routerLink="/dashboard">
                        <mat-icon>add</mat-icon>
                        <span>New Dashboard</span>
                    </button>
                </mat-expansion-panel>

                <button mat-button class="menu-button" routerLink="/widgets">
                    <mat-icon>widgets</mat-icon>
                    <span>Widgets</span>
                </button>

                <mat-divider></mat-divider>

                <button mat-button class="menu-button" routerLink="/devices">
                    <mat-icon>memory</mat-icon>
                    <span>Devices</span>
                </button>
                <button mat-button class="menu-button" routerLink="/alerts">
                    <mat-icon>notifications_active</mat-icon>
                    <span>Alerts</span>
                </button>
                <button mat-button class="menu-button" routerLink="/datamodel">
                    <mat-icon>analytics</mat-icon>
                    <span>Data model</span>
                </button>
            </div>
        }
    </div>

    <div class="app__right-panel">
        <router-outlet></router-outlet>
    </div>
</div>
