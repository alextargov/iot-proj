<app-content-header
    title="Data Models"
    [buttons]="buttons"
></app-content-header>

<div class="datamodel-list__container">
    <!-- Import file input (hidden) -->
    <input
        type="file"
        #fileInput
        accept=".json"
        style="display: none"
        (change)="onFileSelected($event)"
    />

    <table
        mat-table
        [dataSource]="dataSource"
        multiTemplateDataRows
        class="mat-elevation-z8"
    >
        <ng-container *ngFor="let column of columnsToDisplay" [matColumnDef]="column.key">
            <th mat-header-cell *matHeaderCellDef>{{ column.displayName }}</th>
            <td mat-cell *matCellDef="let element">
                @if (column.key === 'deviceCount') {
                    <span class="device-count-badge" [class.device-count-badge--zero]="element[column.key] === 0">
                        {{ element[column.key] }}
                    </span>
                } @else if (column.key === 'currentVersion') {
                    <span class="version-badge">v{{ element[column.key] }}</span>
                } @else {
                    {{ element[column.key] }}
                }
            </td>
        </ng-container>
        <ng-container matColumnDef="expand">
            <th mat-header-cell *matHeaderCellDef aria-label="row actions">
                &nbsp;
            </th>
            <td mat-cell *matCellDef="let element">
                <button
                    mat-icon-button
                    aria-label="expand row"
                    (click)="onToggleClick($event, element)"
                >
                    @if (expandedElement !== element) {
                        <mat-icon>keyboard_arrow_down</mat-icon>
                    } @else {
                        <mat-icon>keyboard_arrow_up</mat-icon>
                    }
                </button>

                <button
                    mat-icon-button
                    matTooltip="Export"
                    (click)="onExportClick($event, element)"
                >
                    <mat-icon>download</mat-icon>
                </button>

                <button
                    mat-icon-button
                    matTooltip="Version History"
                    (click)="onHistoryClick($event, element)"
                >
                    <mat-icon>history</mat-icon>
                </button>

                <button
                    mat-icon-button
                    matTooltip="Delete"
                    (click)="onDeleteClick($event, element)"
                >
                    <mat-icon>delete</mat-icon>
                </button>
            </td>
        </ng-container>

        <!-- Expanded Content Column - The detail row is made up of this one column that spans across all columns -->
        <ng-container matColumnDef="expandedDetail">
            <td
                mat-cell
                *matCellDef="let element"
                [attr.colspan]="columnsToDisplayWithExpand.length"
            >
                <div
                    class="example-element-detail"
                    [@detailExpand]="
                        element === expandedElement ? 'expanded' : 'collapsed'
                    "
                >
                    <div class="example-element-description">
                        {{ element.description }}
                    </div>
                </div>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand"></tr>
        <tr
            mat-row
            *matRowDef="let element; columns: columnsToDisplayWithExpand"
            class="example-element-row"
            [class.example-expanded-row]="expandedElement === element"
            (click)="
                expandedElement = expandedElement === element ? null : element
            "
        ></tr>
        <tr
            mat-row
            *matRowDef="let row; columns: ['expandedDetail']"
            class="example-detail-row"
        ></tr>
    </table>
</div>
