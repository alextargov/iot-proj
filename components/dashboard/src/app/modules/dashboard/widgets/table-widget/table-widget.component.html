<div class="table-widget">
    @if (loading) {
        <div class="loading">
            <mat-spinner diameter="30"></mat-spinner>
        </div>
    } @else if (error) {
        <div class="error">
            <mat-icon>error</mat-icon>
            <span>{{ error }}</span>
        </div>
    } @else if (dataSource.length === 0) {
        <div class="empty">
            <mat-icon>inbox</mat-icon>
            <span>No data available</span>
        </div>
    } @else {
        <div class="table-container">
            <table mat-table [dataSource]="dataSource" class="metrics-table">
                <ng-container matColumnDef="metricName">
                    <th mat-header-cell *matHeaderCellDef>Metric</th>
                    <td mat-cell *matCellDef="let element">{{ element.metricName }}</td>
                </ng-container>

                <ng-container matColumnDef="metricValue">
                    <th mat-header-cell *matHeaderCellDef>Value</th>
                    <td mat-cell *matCellDef="let element">{{ formatValue(element.metricValue, element.unit) }}</td>
                </ng-container>

                <ng-container matColumnDef="recordedAt">
                    <th mat-header-cell *matHeaderCellDef>Time</th>
                    <td mat-cell *matCellDef="let element">{{ formatTimestamp(element.recordedAt) }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    }
</div>
