<div class="integration-form-container">
    <h1>{{ editingId ? 'Edit' : 'Add' }} Integration</h1>

    <form [formGroup]="form" (ngSubmit)="save()">
        <mat-card>
            <mat-card-content>
                <mat-form-field appearance="outline" class="full">
                    <mat-label>Name</mat-label>
                    <input matInput formControlName="name" />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                    <mat-label>Type</mat-label>
                    <mat-select formControlName="type">
                        <mat-option *ngFor="let t of types" [value]="t">{{ t }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                    <mat-label>Endpoint URL</mat-label>
                    <input matInput formControlName="endpoint" placeholder="https://..." />
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                    <mat-label>Auth token (optional, sent as Bearer)</mat-label>
                    <input matInput formControlName="authToken" type="password" />
                    <mat-hint *ngIf="editingId">Leave blank to keep existing token</mat-hint>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full">
                    <mat-label>Config (JSON, optional)</mat-label>
                    <textarea matInput formControlName="config" rows="3"></textarea>
                </mat-form-field>

                <mat-slide-toggle formControlName="enabled" *ngIf="editingId">
                    Enabled
                </mat-slide-toggle>
            </mat-card-content>
        </mat-card>

        <div class="form-actions">
            <button mat-button type="button" (click)="cancel()">Cancel</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="saving">
                {{ editingId ? 'Save' : 'Create' }}
            </button>
        </div>
    </form>
</div>
