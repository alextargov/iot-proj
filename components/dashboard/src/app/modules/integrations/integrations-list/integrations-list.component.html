<div class="integrations-container">
    <div class="header">
        <h1>Integrations</h1>
        <button *ngIf="canWrite" mat-raised-button color="primary" (click)="create()">
            <mat-icon>add</mat-icon>
            Add Integration
        </button>
    </div>

    @if (loading) {
        <app-loading-state message="Loading integrations…"></app-loading-state>
    } @else if (loadError) {
        <app-error-state
            title="Couldn't load integrations"
            message="There was a problem fetching your integrations."
            [retry]="load.bind(this)"
        ></app-error-state>
    } @else if (dataSource.data.length === 0) {
        <app-empty-state
            icon="hub"
            title="No integrations yet"
            message="Connect a webhook or external service to forward events and run rule actions."
            [actionText]="canWrite ? 'Add Integration' : undefined"
            actionIcon="add"
            [action]="create.bind(this)"
        ></app-empty-state>
    } @else {
        <mat-form-field appearance="outline" class="integrations-search">
            <mat-label>Search integrations</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input
                matInput
                (keyup)="applyFilter($event)"
                placeholder="Name, type or endpoint"
                aria-label="Search integrations"
            />
        </mat-form-field>

        <table
            mat-table
            [dataSource]="dataSource"
            matSort
            class="integrations-table"
        >
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let i">{{ i.name }}</td>
            </ng-container>

            <ng-container matColumnDef="type">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Type</th>
                <td mat-cell *matCellDef="let i">{{ i.type }}</td>
            </ng-container>

            <ng-container matColumnDef="endpoint">
                <th mat-header-cell *matHeaderCellDef>Endpoint</th>
                <td mat-cell *matCellDef="let i" class="endpoint-cell" [matTooltip]="i.endpoint">{{ i.endpoint }}</td>
            </ng-container>

            <ng-container matColumnDef="enabled">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Enabled</th>
                <td mat-cell *matCellDef="let i">
                    <mat-icon [class.on]="i.enabled" [class.off]="!i.enabled">
                        {{ i.enabled ? 'check_circle' : 'cancel' }}
                    </mat-icon>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let i">
                    <button
                        mat-icon-button
                        *ngIf="canWrite"
                        (click)="test(i)"
                        [matTooltip]="lastTested[i.id] ? ('Last tested ' + (lastTested[i.id] | date: 'shortTime')) : 'Send test request'"
                    >
                        <mat-icon
                            [class.on]="testResult[i.id] === 'ok'"
                            [class.off]="testResult[i.id] === 'fail'"
                        >
                            {{ testResult[i.id] === 'pending' ? 'hourglass_empty' : 'send' }}
                        </mat-icon>
                    </button>
                    <button mat-icon-button *ngIf="canWrite" (click)="edit(i)" matTooltip="Edit">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button
                        mat-icon-button
                        *ngIf="canWrite"
                        color="warn"
                        (click)="remove(i)"
                        matTooltip="Delete"
                    >
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    No integrations match your search.
                </td>
            </tr>
        </table>

        <mat-paginator
            [pageSizeOptions]="[10, 25, 50]"
            [pageSize]="10"
            showFirstLastButtons
            aria-label="Select page of integrations"
        ></mat-paginator>
    }
</div>
