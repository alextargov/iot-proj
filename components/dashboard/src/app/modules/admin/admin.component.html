<div class="admin-container">
    <h1>Administration</h1>

    <mat-tab-group>
        <!-- Users tab -->
        <mat-tab label="Users">
            <div class="tab-content">
                <div *ngIf="loadingUsers" class="loading">
                    <mat-spinner diameter="40"></mat-spinner>
                </div>

                <ng-container *ngIf="!loadingUsers">
                    <mat-form-field appearance="outline" class="admin-search">
                        <mat-label>Search users</mat-label>
                        <mat-icon matPrefix>search</mat-icon>
                        <input
                            matInput
                            (keyup)="applyUserFilter($event)"
                            placeholder="Username or ID"
                            aria-label="Search users"
                        />
                    </mat-form-field>

                    <table
                        mat-table
                        [dataSource]="usersDataSource"
                        matSort
                        class="admin-table"
                    >
                        <ng-container matColumnDef="username">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Username</th>
                            <td mat-cell *matCellDef="let u">{{ u.username }}</td>
                        </ng-container>
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef>ID</th>
                            <td mat-cell *matCellDef="let u" class="mono">{{ u.id }}</td>
                        </ng-container>
                        <ng-container matColumnDef="role">
                            <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
                            <td mat-cell *matCellDef="let u">
                                <mat-select
                                    [value]="u.role"
                                    (selectionChange)="changeUserRole(u, $event.value)"
                                >
                                    <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
                                </mat-select>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="['username', 'id', 'role']"></tr>
                        <tr mat-row *matRowDef="let row; columns: ['username', 'id', 'role']"></tr>

                        <tr class="mat-row" *matNoDataRow>
                            <td class="mat-cell admin-table__nodata" colspan="3">
                                No users match your search.
                            </td>
                        </tr>
                    </table>

                    <mat-paginator
                        [pageSizeOptions]="[10, 25, 50]"
                        [pageSize]="10"
                        showFirstLastButtons
                        aria-label="Select page of users"
                    ></mat-paginator>
                </ng-container>
            </div>
        </mat-tab>

        <!-- Organizations tab -->
        <mat-tab label="Organizations">
            <div class="tab-content">
                <div class="create-org">
                    <mat-form-field appearance="outline">
                        <mat-label>New organization name</mat-label>
                        <input matInput [(ngModel)]="newOrgName" />
                    </mat-form-field>
                    <button mat-raised-button color="primary" (click)="createOrg()">
                        <mat-icon>add</mat-icon> Create
                    </button>
                </div>

                <div *ngIf="loadingOrgs" class="loading">
                    <mat-spinner diameter="40"></mat-spinner>
                </div>

                <p *ngIf="!loadingOrgs && organizations.length === 0" class="admin-empty">
                    No organizations yet. Create one above to start managing members.
                </p>

                <mat-card *ngFor="let org of organizations" class="org-card">
                    <mat-card-header>
                        <mat-card-title>{{ org.name }}</mat-card-title>
                        <span class="spacer"></span>
                        <button mat-icon-button color="warn" (click)="deleteOrg(org)" matTooltip="Delete organization" [attr.aria-label]="'Delete organization ' + org.name">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </mat-card-header>
                    <mat-card-content>
                        <table mat-table [dataSource]="org.members" class="admin-table">
                            <ng-container matColumnDef="username">
                                <th mat-header-cell *matHeaderCellDef>Member</th>
                                <td mat-cell *matCellDef="let m">{{ m.username }}</td>
                            </ng-container>
                            <ng-container matColumnDef="role">
                                <th mat-header-cell *matHeaderCellDef>Role</th>
                                <td mat-cell *matCellDef="let m">
                                    <mat-select
                                        [value]="m.role"
                                        (selectionChange)="changeMemberRole(org, m.userId, $event.value)"
                                    >
                                        <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
                                    </mat-select>
                                </td>
                            </ng-container>
                            <ng-container matColumnDef="actions">
                                <th mat-header-cell *matHeaderCellDef></th>
                                <td mat-cell *matCellDef="let m">
                                    <button
                                        mat-icon-button
                                        color="warn"
                                        (click)="removeMember(org, m.userId)"
                                        matTooltip="Remove member"
                                        [attr.aria-label]="'Remove member ' + m.username"
                                    >
                                        <mat-icon>person_remove</mat-icon>
                                    </button>
                                </td>
                            </ng-container>

                            <tr mat-header-row *matHeaderRowDef="['username', 'role', 'actions']"></tr>
                            <tr mat-row *matRowDef="let row; columns: ['username', 'role', 'actions']"></tr>
                        </table>

                        <div class="add-member">
                            <mat-form-field appearance="outline">
                                <mat-label>User ID</mat-label>
                                <input matInput [(ngModel)]="memberUserId[org.id]" />
                            </mat-form-field>
                            <mat-form-field appearance="outline">
                                <mat-label>Role</mat-label>
                                <mat-select [(ngModel)]="memberRole[org.id]">
                                    <mat-option *ngFor="let r of roles" [value]="r">{{ r }}</mat-option>
                                </mat-select>
                            </mat-form-field>
                            <button mat-stroked-button (click)="addMember(org)">
                                <mat-icon>person_add</mat-icon> Add member
                            </button>
                        </div>
                    </mat-card-content>
                </mat-card>
            </div>
        </mat-tab>
    </mat-tab-group>
</div>
