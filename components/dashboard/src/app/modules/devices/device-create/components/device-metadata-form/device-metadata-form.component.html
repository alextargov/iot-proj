<div class="metadata-form">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Device Name</mat-label>
    <input matInput [formControl]="$any(form.get('name'))" placeholder="Enter device name" required>
    <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
    <mat-error *ngIf="form.get('name')?.hasError('maxlength')">Name cannot exceed 128 characters</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description</mat-label>
    <textarea matInput [formControl]="$any(form.get('description'))" placeholder="Enter device description" rows="3" required></textarea>
    <mat-error *ngIf="form.get('description')?.hasError('required')">Description is required</mat-error>
    <mat-error *ngIf="form.get('description')?.hasError('maxlength')">Description cannot exceed 512 characters</mat-error>
  </mat-form-field>

  <div class="url-section">
    <mat-form-field appearance="outline" class="url-field">
      <mat-label>Device URL</mat-label>
      <input matInput [formControl]="$any(form.get('deviceURL'))" placeholder="https://device.example.com">
    </mat-form-field>
    <button mat-stroked-button color="primary" (click)="onTestConnectionClick()" [disabled]="!form.get('deviceURL')?.value || isTestingConnection">
      <mat-icon *ngIf="!isTestingConnection">wifi_tethering</mat-icon>
      <mat-spinner *ngIf="isTestingConnection" diameter="20"></mat-spinner>
      Test Connection
    </button>
  </div>

  <div class="endpoint-fields">
    <mat-form-field appearance="outline">
      <mat-label>Turn On Endpoint</mat-label>
      <input matInput [formControl]="$any(form.get('turnOnEndpoint'))" placeholder="/api/turn-on">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Turn Off Endpoint</mat-label>
      <input matInput [formControl]="$any(form.get('turnOffEndpoint'))" placeholder="/api/turn-off">
    </mat-form-field>
  </div>

  <div class="tags-section">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tags</mat-label>
      <mat-chip-grid #chipGrid>
        <mat-chip-row *ngFor="let tag of tags" (removed)="removeTag(tag)">
          {{ tag }}
          <button matChipRemove>
            <mat-icon>cancel</mat-icon>
          </button>
        </mat-chip-row>
      </mat-chip-grid>
      <input placeholder="Add tag..."
             [matChipInputFor]="chipGrid"
             [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
             (matChipInputTokenEnd)="addTag($event)">
    </mat-form-field>
  </div>
</div>
