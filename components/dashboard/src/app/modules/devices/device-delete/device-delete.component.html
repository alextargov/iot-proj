<div class="device-delete__content">
    <h1 mat-dialog-title>Delete device "{{ device.name }}"?</h1>
    <div mat-dialog-content>
        <p class="device-delete__warning">
            <mat-icon color="warn">warning</mat-icon>
            This permanently deletes
            <strong>{{ device.name }}</strong> along with its configuration,
            authentication credentials, and recorded metrics. This action cannot
            be undone.
        </p>

        <p class="device-delete__prompt">
            Type <strong>{{ device.name }}</strong> to confirm:
        </p>
        <mat-form-field appearance="outline" class="device-delete__field">
            <input
                matInput
                [(ngModel)]="confirmName"
                (keyup.enter)="delete()"
                placeholder="Device name"
                aria-label="Type the device name to confirm deletion"
                autocomplete="off"
            />
        </mat-form-field>
    </div>
    <div mat-dialog-actions align="end">
        <button mat-button (click)="close()">Cancel</button>
        <button
            mat-raised-button
            color="warn"
            [disabled]="!nameMatches"
            (click)="delete()"
        >
            Delete device
        </button>
    </div>
</div>
